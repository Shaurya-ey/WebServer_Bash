
<html>
    <head>
        <title>Login | Bash WebServer</title>
        <style>
            body {
                font-family: Arial, Helvetica, sans-serif;
                background: #f5f5f5;
            }
            section {
                display: inline-block;
                margin-left: 40%;
                margin-top: 10%;
                width: 320px;
                padding:25px;
                background: white;
                border-radius: 8px;
            }
            input {
                box-sizing:border-box;
                width:100%;
                height:35px;
                margin:10px 0;
                padding:5px;
            }
            input[name="submit"]{
                background:#2563eb;
                color: white;
                border:none;
                border-radius:4px;
            }
        </style>
    </head>
    <body>
        <section>
            <h2>Welcome!!</h2>
            <form method="POST" action="/login">
                <label>Username</label>
                <input type="text" name="name" required>
                <label>Password</label>
                <input type="password" name="password" required>
                <input type="submit" value="Login"></input>
            </form>
        </section>
    </body>
    
</html>
